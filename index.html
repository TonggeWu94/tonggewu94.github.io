<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline of My Life</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: 'SF Hello', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0;
        }

        .header p {
            font-size: 0.9em;
            letter-spacing: 1px;
            margin: 10px 0 0 0;
            opacity: 0.8;
        }

        .timeline-wrapper {
            position: relative;
            width: 960px;
            max-width: 95vw;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .age-label {
            font-family: 'SF Hello', -apple-system, sans-serif;
            font-size: 12px;
            fill: white;
            opacity: 0.7;
            dominant-baseline: middle;
        }

        .today-dot-glow {
            animation: breathGlow 2.5s ease-in-out infinite;
        }

        .today-dot-core {
            animation: breathCore 2.5s ease-in-out infinite;
        }

        @keyframes breathCore {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes breathGlow {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>TIMELINE OF MY LIFE</h1>
        <p>TAKE A STEP BACK AND GAIN A NEW PERSPECTIVE ON MY LIFE</p>
    </div>

    <div class="timeline-wrapper" id="wrapper">
        <svg id="timeline"></svg>
    </div>

    <script>
        const birthday = new Date('1994-12-20');
        const today = new Date();

        const ageInDays = (today - birthday) / (24 * 60 * 60 * 1000);
        const currentAge = Math.floor(ageInDays / 365.25);

        const yearStart = new Date(birthday);
        yearStart.setFullYear(birthday.getFullYear() + currentAge);
        const yearEnd = new Date(yearStart);
        yearEnd.setFullYear(yearStart.getFullYear() + 1);
        const yearProgress = Math.min((today - yearStart) / (yearEnd - yearStart), 1);

        const rowHeight = 30;
        const turnRadius = rowHeight / 2;
        const lineWidth = 4;
        const marginLeft = 40;
        const marginRight = 40;
        const labelAreaWidth = 160;
        const snakeWidth = 800;
        const svgWidth = snakeWidth + labelAreaWidth;
        const lineLength = snakeWidth - marginLeft - marginRight;
        const totalRows = 100;
        const svgHeight = totalRows * rowHeight + 20;

        const svg = document.getElementById('timeline');
        svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
        svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

        function getColor(age) {
            if (age <= 12) return '#FFD700';  // Childhood - Yellow
            if (age <= 19) return '#FF8C00';  // Adolescence - Orange
            if (age <= 34) return '#FF1493';  // Early Adulthood - Pink
            if (age <= 49) return '#8B008B';  // Middle Adulthood - Purple
            if (age <= 79) return '#00BFFF';  // Mature Adulthood - Blue
            return '#32CD32';                 // Late Adulthood - Green
        }

        function getYForRow(row) {
            return 10 + row * rowHeight + rowHeight / 2;
        }

        // Draw the snake as one continuous path using segments per year

        for (let age = 0; age < totalRows; age++) {
            const y = getYForRow(age);
            const isLeftToRight = age % 2 === 0;

            const xStart = isLeftToRight ? marginLeft : (snakeWidth - marginRight);
            const xEnd = isLeftToRight ? (snakeWidth - marginRight) : marginLeft;

            const color = getColor(age);
            const futureColor = '#333';

            if (age < currentAge) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', xStart);
                line.setAttribute('y1', y);
                line.setAttribute('x2', xEnd);
                line.setAttribute('y2', y);
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', lineWidth);
                line.setAttribute('stroke-linecap', 'butt');
                svg.appendChild(line);
            } else if (age === currentAge) {
                // Partial line: colored portion + grey remainder
                const progressX = isLeftToRight
                    ? marginLeft + lineLength * yearProgress
                    : (snakeWidth - marginRight) - lineLength * yearProgress;

                // Colored part
                const coloredLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                coloredLine.setAttribute('x1', xStart);
                coloredLine.setAttribute('y1', y);
                coloredLine.setAttribute('x2', progressX);
                coloredLine.setAttribute('y2', y);
                coloredLine.setAttribute('stroke', color);
                coloredLine.setAttribute('stroke-width', lineWidth);
                coloredLine.setAttribute('stroke-linecap', 'butt');
                svg.appendChild(coloredLine);

                // Grey part
                const greyLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                greyLine.setAttribute('x1', progressX);
                greyLine.setAttribute('y1', y);
                greyLine.setAttribute('x2', xEnd);
                greyLine.setAttribute('y2', y);
                greyLine.setAttribute('stroke', futureColor);
                greyLine.setAttribute('stroke-width', lineWidth);
                greyLine.setAttribute('stroke-linecap', 'butt');
                svg.appendChild(greyLine);

                // Today dot with breathing glow
                const totalWeeks = 52 * 100;
                const weeksLived = Math.floor(ageInDays / 7);

                const dotGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                dotGroup.style.cursor = 'pointer';

                const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                glow.setAttribute('cx', progressX);
                glow.setAttribute('cy', y);
                glow.setAttribute('r', '14');
                glow.setAttribute('fill', 'white');
                glow.setAttribute('opacity', '0');
                glow.classList.add('today-dot-glow');
                dotGroup.appendChild(glow);

                const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dot.setAttribute('cx', progressX);
                dot.setAttribute('cy', y);
                dot.setAttribute('r', '6');
                dot.setAttribute('fill', 'white');
                dot.setAttribute('opacity', '0.4');
                dot.classList.add('today-dot-core');
                dotGroup.appendChild(dot);

                // Invisible larger hit area for hover/touch
                const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                hitArea.setAttribute('cx', progressX);
                hitArea.setAttribute('cy', y);
                hitArea.setAttribute('r', '20');
                hitArea.setAttribute('fill', 'transparent');
                dotGroup.appendChild(hitArea);

                // Tooltip
                const tooltip = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                tooltip.setAttribute('opacity', '0');
                tooltip.style.transition = 'opacity 0.3s';

                const tooltipBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                const tooltipText = `Week ${weeksLived.toLocaleString()} of ${totalWeeks.toLocaleString()}`;
                tooltipBg.setAttribute('x', progressX - 120);
                tooltipBg.setAttribute('y', y - 40);
                tooltipBg.setAttribute('width', '240');
                tooltipBg.setAttribute('height', '30');
                tooltipBg.setAttribute('rx', '4');
                tooltipBg.setAttribute('fill', 'rgba(255,255,255,0.15)');
                tooltip.appendChild(tooltipBg);

                const tooltipLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                tooltipLabel.setAttribute('x', progressX);
                tooltipLabel.setAttribute('y', y - 21);
                tooltipLabel.setAttribute('text-anchor', 'middle');
                tooltipLabel.setAttribute('dominant-baseline', 'middle');
                tooltipLabel.setAttribute('fill', 'white');
                tooltipLabel.setAttribute('font-size', '16');
                tooltipLabel.setAttribute('font-family', 'SF Hello, -apple-system, sans-serif');
                tooltipLabel.textContent = tooltipText;
                tooltip.appendChild(tooltipLabel);

                dotGroup.appendChild(tooltip);
                svg.appendChild(dotGroup);

                dotGroup.addEventListener('mouseenter', () => tooltip.setAttribute('opacity', '1'));
                dotGroup.addEventListener('mouseleave', () => tooltip.setAttribute('opacity', '0'));
                dotGroup.addEventListener('touchstart', () => tooltip.setAttribute('opacity', '1'));
                dotGroup.addEventListener('touchend', () => setTimeout(() => tooltip.setAttribute('opacity', '0'), 2000));
            } else {
                // Future: grey line
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', xStart);
                line.setAttribute('y1', y);
                line.setAttribute('x2', xEnd);
                line.setAttribute('y2', y);
                line.setAttribute('stroke', futureColor);
                line.setAttribute('stroke-width', lineWidth);
                line.setAttribute('stroke-linecap', 'butt');
                svg.appendChild(line);
            }

            // Draw U-turn connecting this row to the next
            if (age < totalRows - 1) {
                const nextY = getYForRow(age + 1);
                const turnColor = age < currentAge ? color : futureColor;

                const turn = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                let d;

                if (isLeftToRight) {
                    // U-turn on the right side
                    const cx = snakeWidth - marginRight;
                    d = `M ${cx} ${y} A ${turnRadius} ${turnRadius} 0 0 1 ${cx} ${nextY}`;
                } else {
                    // U-turn on the left side
                    const cx = marginLeft;
                    d = `M ${cx} ${y} A ${turnRadius} ${turnRadius} 0 0 0 ${cx} ${nextY}`;
                }

                turn.setAttribute('d', d);
                turn.setAttribute('fill', 'none');
                turn.setAttribute('stroke', turnColor);
                turn.setAttribute('stroke-width', lineWidth);
                turn.setAttribute('stroke-linecap', 'butt');
                svg.appendChild(turn);
            }

            // Age labels
            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('y', y);
            label.setAttribute('class', 'age-label');
            label.textContent = age;

            if (age % 2 === 0) {
                label.setAttribute('x', marginLeft - 25);
                label.setAttribute('text-anchor', 'end');
            } else {
                label.setAttribute('x', snakeWidth - marginRight + 25);
                label.setAttribute('text-anchor', 'start');
            }

            svg.appendChild(label);
        }

        // Life stage labels on the right side (vertical text)
        const stages = [
            { start: 0, end: 12, label: 'CHILDHOOD (0-12)' },
            { start: 13, end: 19, label: 'ADOLESCENCE (13-19)' },
            { start: 20, end: 34, label: 'EARLY ADULTHOOD (20-34)' },
            { start: 35, end: 49, label: 'MIDDLE ADULTHOOD (35-49)' },
            { start: 50, end: 79, label: 'MATURE ADULTHOOD (50-79)' },
            { start: 80, end: 99, label: 'LATE ADULTHOOD (80-99)' },
        ];

        const stageLabelX = snakeWidth + labelAreaWidth / 2;

        stages.forEach(stage => {
            const yTop = getYForRow(stage.start);
            const yBottom = getYForRow(stage.end);
            const yMid = (yTop + yBottom) / 2;

            // Use the color from the middle of the section
            const midAge = Math.floor((stage.start + stage.end) / 2);
            const stageColor = getColor(midAge);

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', stageLabelX);
            text.setAttribute('y', yMid);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'middle');
            text.setAttribute('transform', `rotate(90, ${stageLabelX}, ${yMid})`);
            text.setAttribute('fill', stageColor);
            text.setAttribute('opacity', '0.8');
            text.setAttribute('font-size', '14');
            text.setAttribute('font-family', 'SF Hello, -apple-system, sans-serif');
            text.setAttribute('font-weight', 'bold');
            text.setAttribute('letter-spacing', '2');
            text.textContent = stage.label;
            svg.appendChild(text);
        });
    </script>
</body>
</html>
